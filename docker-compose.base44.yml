services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5173"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - VITE_API_TARGET=http://api:8787
    command: sh -c "npm install && npm run dev"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - /run/base44/app.env
    environment:
      - OPENROUTER_MODEL=nvidia/nemotron-3-ultra-550b-a55b:free
      - PORT=8787
    command: sh -c "npm install && node server/index.mjs"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
